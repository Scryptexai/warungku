# Reverse proxy Warungku (Next.js) — app.tritan.cloud
# ===========================================================================
# Domain di-PROXY lewat Cloudflare (orange cloud).
# Origin (server ini) melayani:
#   - port 80  : untuk request HTTP yang diteruskan Cloudflare
#   - port 443 : HTTPS ke origin (Cloudflare SSL mode Full / Full-strict)
# App Next.js berjalan di 127.0.0.1:3000 (dikelola pm2, proses "warungku").
#
# Sertifikat origin ada di /etc/nginx/ssl/app.tritan.cloud/
#   - Awalnya SELF-SIGNED (dibuat oleh deploy-root.sh) → cukup untuk mode "Full".
#   - Untuk mode "Full (strict)": ganti dengan Cloudflare Origin Certificate
#     (file yang sama), lalu reload nginx.
#
# CATATAN: TIDAK ada redirect http->https di origin. Biarkan Cloudflare
# ("Always Use HTTPS") yang menangani, agar tidak terjadi redirect loop.
# ===========================================================================

# --- IP asli pengunjung di belakang Cloudflare -----------------------------
# Agar log & rate-limit melihat IP klien sebenarnya, bukan IP Cloudflare.
# Sumber daftar: https://www.cloudflare.com/ips/ (perbarui bila berubah).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Blok reuse: pengaturan proxy ke aplikasi Next.js ----------------------
# (didefinisikan sekali, dipakai di server 80 & 443)

server {
    listen 80;
    listen [::]:80;
    server_name app.tritan.cloud;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.tritan.cloud;

    ssl_certificate     /etc/nginx/ssl/app.tritan.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/app.tritan.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
